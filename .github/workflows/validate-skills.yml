name: Awesome SDET - Validate & Audit Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-review:
    name: Dependency Security Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  test-mcp-server:
    name: Test MCP Server (Build & Protocol)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test MCP server build and test suites
        run: pnpm test

  validate-and-audit:
    name: Validate Skills & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: pnpm run build

      - name: Run TypeScript Typecheck
        run: pnpm run typecheck

      - name: Run Package Security Audit
        run: pnpm run audit

      - name: Run Skill Security Audit
        run: pnpm run audit:skills

      - name: Run Schema Linter
        run: pnpm run lint:skills

      - name: Run Skills Check CI
        uses: voodootikigod/skills-check@v1.2.1
        with:
          commands: audit
          skills-dir: ./skills
